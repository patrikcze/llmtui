name: Release

# Only annotated/lightweight tags shaped like v1.2.3 (or v1.2.3-rc1) publish
# a release. Regular pushes to master run CI only.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race ./...

  release:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    env:
      LLMTUI_RUNTIME_CACHE: ${{ github.workspace }}/.runtime-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            goos: darwin
            goarch: arm64
            cgo: "1"
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            cgo: "1"
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: "0"
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cgo: "0"
          - runner: windows-latest
            goos: windows
            goarch: amd64
            cgo: "0"
          # No upstream llama.cpp release exists for Android, so this build
          # skips runtime staging entirely (see dist-archive-android in the
          # Makefile) — network providers only, no embedded/local inference.
          - runner: ubuntu-latest
            goos: android
            goarch: arm64
            cgo: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Android NDK
        if: matrix.goos == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false

      - name: Cache pinned llama.cpp runtime
        if: matrix.goos != 'android'
        uses: actions/cache@v5
        with:
          path: ${{ env.LLMTUI_RUNTIME_CACHE }}
          key: llama-runtime-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('internal/runtime/pin.json') }}

      - name: Build self-contained release archive
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: >-
          make dist-archive VERSION="${GITHUB_REF_NAME}"
          TARGET_GOOS=${{ matrix.goos }}
          TARGET_GOARCH=${{ matrix.goarch }}
          CGO_ENABLED=${{ matrix.cgo }}

      - name: Upload release platform
        uses: actions/upload-artifact@v7
        with:
          name: llmtui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          # Full history so release notes can diff against the previous tag.
          fetch-depth: 0

      - name: Download release platforms
        uses: actions/download-artifact@v8
        with:
          pattern: llmtui-*
          path: dist
          merge-multiple: true

      - name: Assert release-naming contract (llmtui self update depends on this)
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            "llmtui-${GITHUB_REF_NAME}-darwin-amd64.tar.gz" \
            "llmtui-${GITHUB_REF_NAME}-darwin-arm64.tar.gz" \
            "llmtui-${GITHUB_REF_NAME}-linux-amd64.tar.gz" \
            "llmtui-${GITHUB_REF_NAME}-linux-arm64.tar.gz" \
            "llmtui-${GITHUB_REF_NAME}-windows-amd64.zip"; do
            if [ ! -f "dist/$name" ]; then
              echo "::error::expected release asset missing: $name (see docs/self-management.md)"
              missing=1
            fi
          done
          exit $missing

      - name: Generate checksums
        run: cd dist && find . -maxdepth 1 -type f ! -name checksums.txt -print | LC_ALL=C sort | xargs shasum -a 256 > checksums.txt

      - name: Generate release notes
        run: bash .github/scripts/release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease_flag="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "llmtui $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            $prerelease_flag
