name: macOS setup app

# Builds and tests the LLMTUIGUI setup app (macos/setup) on pull requests that
# touch it, and on a release tag attaches the ad-hoc signed app — with that
# tag's llmtui embedded — to the GitHub release that release.yml creates.
# Uses only the workflow token; no signing secrets exist or are needed.

on:
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos-setup.yml"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  guard:
    name: No signing identity or per-user Xcode state
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Reject committed team IDs and local Xcode files
        run: macos/setup/scripts/check-no-signing-identity.sh

  test:
    name: Build and test (unsigned)
    if: github.event_name == 'pull_request'
    needs: guard
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version

      - name: Test
        run: |
          xcodebuild -quiet \
            -project macos/setup/LLMTUIGUI.xcodeproj \
            -scheme LLMTUIGUI \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test

  ios-test:
    name: iOS app unit tests (simulator)
    if: github.event_name == 'pull_request'
    needs: guard
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version

      - name: Pick an iPhone simulator
        run: |
          # The newest available iOS runtime's first iPhone, by UDID, so the
          # job does not depend on which device names the runner image ships.
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in devices if ".iOS-" in r),
                       key=lambda r: [int(p) for p in r.rsplit(".iOS-", 1)[1].split("-")])
          for runtime in reversed(ios):
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          ')
          if [ -z "$udid" ]; then
            echo "::error::no available iPhone simulator on this runner" >&2
            exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Unit tests
        # Unit tests only (LLMTUIiOSTests): they compile the app for the
        # simulator without signing and cover the chat model, tools,
        # document extraction (PDFKit, Vision), citations and retention. The
        # UI-test target only launches the app and is left out to keep the
        # job short.
        run: |
          xcodebuild -quiet \
            -project macos/setup/LLMTUIGUI.xcodeproj \
            -scheme LLMTUIiOS \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:LLMTUIiOSTests \
            CODE_SIGNING_ALLOWED=NO \
            test

  release:
    name: Package and attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: guard
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Select newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version

      - name: Build llmtui and package the app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
        run: make macos-setup VERSION="$GITHUB_REF_NAME" DIST=dist-macos

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: llmtui-macos-setup
          path: dist-macos/*
          if-no-files-found: error

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release.yml creates the release after its own builds finish; wait
          # for it (up to ~40 minutes) instead of racing it.
          for _ in $(seq 1 80); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" dist-macos/* --clobber
              exit 0
            fi
            sleep 30
          done
          echo "::error::release $GITHUB_REF_NAME was not created in time; the app is still available as a workflow artifact" >&2
          exit 1
